# Keeps the station files in data/ up to date: measured snow for Alta and Solitude, and the
# readings behind Solitude's Weather Stations tab.
# Needs one repository secret, SYNOPTIC_TOKEN (Settings > Secrets and variables > Actions).
name: Update station data

on:
  schedule:
    - cron: "12 * * * *" # every hour, at 12 minutes past (the station reports on the hour)
  workflow_dispatch: # lets it be run by hand from the Actions tab

permissions:
  contents: write # to commit the updated data files

concurrency:
  group: station-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch readings
        run: python scripts/fetch_stations.py
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}

      - name: Commit the data files if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new readings."
          else
            git commit -m "Update station data"
            git push
          fi
