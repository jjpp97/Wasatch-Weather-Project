# Every morning: snapshots what each model forecasts for Alta's Mid-Collins point, checks earlier
# snapshots against the snow the Collins board measured, and relearns which blend of models
# forecasts best (scripts/learn_alta.py). The Beta tab reads data/alta-learning.json.
# Needs no secrets: it uses Open-Meteo's free APIs and data/alta-collins.json.
name: Learn model weights

on:
  schedule:
    - cron: "40 13 * * *" # 13:40 UTC daily, after the runs behind the 12Z (6 AM MDT) snapshot are out
  workflow_dispatch: # lets it be run by hand from the Actions tab

permissions:
  contents: write # to commit the updated learning files

concurrency:
  group: station-data # the same group as the station job, so the two never push at once
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot, verify and learn
        run: python scripts/learn_alta.py

      - name: Commit the learning files if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alta-learning.json data/alta-learning-state.json
          if git diff --cached --quiet; then
            echo "Nothing new learned."
          else
            git commit -m "Update model learning"
            git pull --rebase
            git push
          fi
